name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.32.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install pinned NATS server
        shell: bash
        run: |
          set -euo pipefail
          archive=nats-server-v2.14.3-linux-amd64.tar.gz
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/nats-io/nats-server/releases/download/v2.14.3/$archive"
          printf '%s  %s\n' \
            'f3d0c820c749f81d717310fb00d4903919e70e3e66b268bd352a088b9788eb93' \
            "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive"
          printf '%s\n' "$PWD/nats-server-v2.14.3-linux-amd64" >> "$GITHUB_PATH"

      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test with coverage gates
        run: pnpm -r test:ci

      - name: Build
        run: pnpm -r build

      - name: Check committed diff whitespace
        run: git diff --check HEAD^ HEAD
